<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StoryForge — image lab</title>
<link rel="stylesheet" href="/style.css">

<div class="topbar">
  <a href="/">← library</a>
  <span id="meta"></span>
</div>

<div class="lab">
  <div class="pane">
    <h1>Image lab</h1>
    <p class="sub">The same pipeline the stories use, with nothing in front of it.</p>

    <label>Model <span class="hint">switching here switches it for the stories too</span></label>
    <select id="model"></select>
    <p class="modelnote sub" id="modelnote"></p>

    <label>Positive prompt</label>
    <textarea id="pos" rows="7" placeholder="1girl, solo, long black hair, red gown, holding a lantern, ornate landing, warm light, upper body, masterpiece, best quality"></textarea>

    <label>Negative prompt <span class="hint" id="neghint"></span></label>
    <textarea id="neg" rows="4" placeholder="lowres, bad anatomy, extra fingers, watermark"></textarea>

    <div class="row3">
      <div><label>Steps</label><input id="steps" type="number" min="1" max="60"></div>
      <div><label>CFG</label><input id="cfg" type="number" step="0.5" min="1" max="15"></div>
      <div><label>Width</label><input id="w" type="number" step="64" min="256" max="1536"></div>
      <div><label>Height</label><input id="h" type="number" step="64" min="256" max="1536"></div>
    </div>
    <div class="row3">
      <div class="grow2"><label>Seed <span class="hint">blank = random</span></label>
        <input id="seed" type="text" placeholder="random"></div>
      <div><label>&nbsp;</label><button id="go">Generate</button></div>
    </div>

    <div class="presets">
      <span class="hint">frame:</span>
      <span id="shapes"></span>
    </div>

    <div class="presets">
      <span class="hint">negative presets:</span>
      <button class="icon" data-r="all">all ages</button>
      <button class="icon" data-r="13+">13+</button>
      <button class="icon" data-r="18+">18+</button>
    </div>

    <div id="labstatus" class="sub"></div>
  </div>

  <div class="pane result">
    <div id="out" class="outbox"><span class="sub">No image yet.</span></div>
    <div id="prog" class="labprog"><span id="proglabel"></span><span class="bar"><i></i></span></div>
    <div id="info" class="sub"></div>
  </div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
let defaults = null, catalog = null, jobId = null;

// ── progress socket ─────────────────────────────────────────────────────
// The lab watches the same ComfyUI stream the reading view does. Without it
// a 30s model load looks exactly like a hung button.
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/lab`);
  const ping = setInterval(() => ws.readyState === 1 && ws.send(JSON.stringify({ t: 'ping' })), 20000);
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    const d = m.d || {};
    if (d.job_id && d.job_id !== jobId) return;    // someone else's render
    if (m.t === 'lab_state') setProgress(d.status, null);
    if (m.t === 'lab_progress') setProgress(`drawing ${d.pct}%`, d.pct);
    if (m.t === 'lab_preview') showPreview(d.data_url);
    if (m.t === 'lab_failed') setProgress('failed', 0);
  };
  ws.onclose = () => { clearInterval(ping); setTimeout(connect, 2000); };
}

function setProgress(label, pct) {
  $('prog').classList.toggle('on', label !== '');
  $('proglabel').textContent = label || '';
  if (pct != null) $('prog').querySelector('.bar i').style.width = pct + '%';
}

function showPreview(url) {
  let img = $('out').querySelector('img');
  if (!img) { $('out').innerHTML = ''; img = document.createElement('img'); $('out').append(img); }
  img.src = url;
  img.classList.add('preview');
}

// ── model switcher ──────────────────────────────────────────────────────

function fillModels() {
  const sel = $('model');
  sel.innerHTML = '';
  for (const m of catalog.models) {
    const o = document.createElement('option');
    o.value = m.name;
    o.textContent = m.label + (m.tuned ? '' : '  (untuned)');
    o.selected = m.name === catalog.active;
    sel.append(o);
  }
  showModelNote();
}

function currentModel() {
  return catalog.models.find(m => m.name === $('model').value) || {};
}

function showModelNote() {
  const m = currentModel();
  $('modelnote').textContent =
    [`${m.arch || '?'} · ${m.family || '?'} prompts`,
     `cfg ${m.cfg} · ${m.steps} steps · ${m.sampler}`,
     m.sampling && m.sampling !== 'eps' ? m.sampling : null,
     m.notes].filter(Boolean).join(' — ');
  $('meta').textContent = `${m.label || ''} · ${m.width}×${m.height}`;
  // At CFG 1 the negative barely does anything — say so rather than let it
  // look like a working control.
  $('neghint').textContent = Number(m.cfg) <= 1.01
    ? '— weak at cfg 1, use the positive prompt instead' : '';
}

function applyModelDefaults() {
  const m = currentModel();
  $('steps').value = m.steps; $('cfg').value = m.cfg;
  $('w').value = m.width; $('h').value = m.height;
}

$('model').onchange = async () => {
  const name = $('model').value;
  $('labstatus').textContent = 'switching…';
  try {
    const r = await fetch(`/api/models/active?name=${encodeURIComponent(name)}`,
                          { method: 'POST' });
    if (!r.ok) throw new Error((await r.text()).slice(0, 200));
    catalog.active = name;
    applyModelDefaults();
    showModelNote();
    $('labstatus').textContent = 'now drawing with ' + currentModel().label;
  } catch (e) {
    $('labstatus').textContent = 'switch failed: ' + e.message;
  }
};

// ── init ────────────────────────────────────────────────────────────────

async function init() {
  defaults = await fetch('/api/lab/defaults').then(r => r.json());
  catalog = defaults.models;
  fillModels();
  applyModelDefaults();
  fillShapes();
  $('neg').value = defaults.negatives_by_rating['13+'] || '';
  connect();
}

// The same frame shapes the narrator can ask for, so what you tune here is
// what a story can actually produce.
function fillShapes() {
  const box = document.getElementById('shapes');
  box.innerHTML = '';
  for (const [name, wh] of Object.entries(defaults.shapes || {})) {
    const b = document.createElement('button');
    b.className = 'icon';
    b.textContent = name;
    b.title = `${wh[0]}×${wh[1]}`;
    b.onclick = () => { $('w').value = wh[0]; $('h').value = wh[1]; };
    box.append(b);
  }
}

for (const b of document.querySelectorAll('.presets .icon')) {
  b.onclick = () => { $('neg').value = defaults.negatives_by_rating[b.dataset.r] || ''; };
}

$('go').onclick = async () => {
  const positive = $('pos').value.trim();
  if (!positive) { $('labstatus').textContent = 'positive prompt is required'; return; }
  $('go').disabled = true;
  $('labstatus').textContent = '';
  jobId = (crypto.randomUUID?.() || String(Math.random())).replace(/-/g, '');
  setProgress('queued', 0);
  const t0 = performance.now();
  try {
    const r = await fetch('/api/lab/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        positive, negative: $('neg').value.trim(),
        checkpoint: $('model').value, job_id: jobId,
        steps: +$('steps').value, cfg: +$('cfg').value,
        width: +$('w').value, height: +$('h').value,
        seed: $('seed').value.trim(),
      }),
    });
    if (!r.ok) throw new Error((await r.text()).slice(0, 300));
    const d = await r.json();
    $('out').innerHTML = '';
    const img = document.createElement('img');
    img.src = d.url;
    $('out').append(img);
    $('info').textContent =
      `${d.width}×${d.height} · ${d.steps} steps · cfg ${d.cfg} · seed ${d.seed}`
      + ` · ${d.wall_s}s server · ${((performance.now() - t0) / 1000).toFixed(1)}s round trip`
      + `\n${d.model}`;
    setProgress('', null);
  } catch (e) {
    $('labstatus').textContent = 'failed: ' + e.message;
    setProgress('', null);
  } finally {
    $('go').disabled = false;
  }
};

$('pos').addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') $('go').click();
});

init();
</script>
